name: Validar proyecto

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Instalar entorno reproducible
        run: |
          python -m pip install uv==0.12.15
          uv sync --locked --extra dev
      - name: Comprobar código y tipos
        run: |
          uv run ruff check src tests scripts
          uv run mypy --strict src tests scripts/build_dashboard.py
      - name: Verificar contratos y ecuaciones
        run: uv run pytest -q
