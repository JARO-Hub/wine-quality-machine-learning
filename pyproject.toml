[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "wine-quality-lab"
version = "0.1.0"
description = "Práctica reproducible de preprocesamiento y selección de modelos de calidad de vino."
requires-python = ">=3.12"
dependencies = ["numpy>=2.0,<3", "polars>=1.30,<2", "scikit-learn>=1.6,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "mypy>=1.15,<3", "ruff>=0.11,<1"]

[project.scripts]
wine-quality = "wine_quality.cli:main"
wine-neural = "wine_quality.neural_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wine_quality"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["wine_quality"]

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true
